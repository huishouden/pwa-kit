name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./actions/leak-scan
      - uses: ./actions/license-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      # The SDK's read budgets and the outbox against the Firestore emulator (STANDARD.md "Read budgets").
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run test:emulator
      - run: bun run build
      - name: Workflows and hooks parse
        run: |
          bash -n templates/githooks/pre-commit infra/bootstrap.sh actions/license-check/check.sh
          for f in .github/workflows/*.yml actions/*/action.yml; do python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f"; done
      - name: No browser against production in the kit's workflows (docs/one-site.md "Bandwidth")
        run: bun scripts/bandwidth-check.ts .github/workflows

  # Versions are CI's, never a commit (STANDARD.md "Versions"): on main, the next semver from the
  # Conventional Commit titles since the last v* tag, an annotated tag, and a GitHub release with
  # generated notes and the package tarball (built here, not committed) that apps install by URL.
  # package.json stays 0.0.0; the tarball is packed with the release's version. Three jobs, so the
  # one that installs and builds holds no write access: tag (write, runs no repo code), pack (read),
  # release (write, runs nothing from the repo).
  tag:
    needs: [leak-scan, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prev: ${{ steps.tag.outputs.prev }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag it
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force -q
          tag=$(python3 scripts/next-version.py | sed -n 's/^tag=//p')
          if [ -n "$tag" ]; then
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then echo "::error title=$tag is another commit's::$tag already points to $(git rev-list -n 1 "$tag"), not $GITHUB_SHA; rerun this workflow"; exit 1; fi
              echo "$tag is already tagged"
            else
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "$tag" -m "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          else
            echo "nothing to release: only chore, docs, test or ci commits since the last tag"
          fi
          # The newest tag has its release (a cancelled run's tag is finished here).
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && ! gh release view "$last" >/dev/null 2>&1; then
            echo "release=$last" >> "$GITHUB_OUTPUT"
            echo "prev=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 2p)" >> "$GITHUB_OUTPUT"
          fi

  pack:
    needs: tag
    if: needs.tag.outputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.tag.outputs.release }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build and pack
        env:
          TAG: ${{ needs.tag.outputs.release }}
        run: |
          set -euo pipefail
          v=${TAG#v}
          bun install --frozen-lockfile
          jq --arg v "$v" '.version = $v' package.json > "$RUNNER_TEMP/package.json" && cp "$RUNNER_TEMP/package.json" package.json
          bun run build
          bun pm pack --filename "pwa-kit-$v.tgz" --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarball
          path: pwa-kit-*.tgz
          retention-days: 1

  release:
    needs: [tag, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tarball
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.release }}
          PREV: ${{ needs.tag.outputs.prev }}
        run: gh release create "$TAG" pwa-kit-*.tgz -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes ${PREV:+--notes-start-tag "$PREV"}
